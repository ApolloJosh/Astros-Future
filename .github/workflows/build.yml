name: Build data & deploy

on:
  schedule:
    - cron: "0 11 * * *"    # daily ~6am CT
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "config.json", "data-sources/rankings.json", "docs/**", "!docs/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# Uploading files one at a time through the GitHub web UI makes one commit —
# and one run — per file. With queuing, six uploads meant six deployments
# lining up behind each other and the later ones timed out waiting their turn.
# Superseding runs instead is safe here because every run rebuilds the same
# final state from scratch, so the last one to finish is the one that matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tests
        run: npm test
      - name: Build data (rankings sheet + MLB StatsAPI + percentiles)
        run: npm run build
      - name: Commit refreshed data
        continue-on-error: true
        run: |
          git config user.name astros-future-bot
          git config user.email actions@github.com
          git add docs/data data-sources/rankings.json data-sources/cache.json data-sources/pools.json || true
          git diff --cached --quiet || git commit -m 'data refresh'
          git push || echo 'push skipped'
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000   # 20 min; the 10-min default was being hit
